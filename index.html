<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0c11">
  <title>Mirage Realms MMORPG Map</title>
  <link rel="icon" type="image/png" sizes="128x128" href="favicon.png">

  <meta property="og:title" content="Mirage Realms MMORPG Map">
  <meta property="og:description" content="Explore!">
  <meta property="og:image" content="https://qxb3.github.io/mirage-map/preview.gif">
  <meta property="og:type" content="website">

  <link rel="apple-touch-icon" href="favicon.png">
  <link rel="preload" href="fonts/iosevka.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="map" aria-label="Mirage Realms MMORPG Interactive Map"></canvas>

  <div class="actions">
    <button class="light-dark" id="light-dark" type="button" aria-pressed="false" title="Toggle day and night">Day</button>
    <button class="light-dark roof-toggle" id="roof-toggle" type="button" aria-pressed="false" title="Hide house roofs" hidden>Roofs</button>
  </div>

  <header class="topbar">
    <nav class="layers" id="layers" aria-label="World layers"></nav>
  </header>

  <div class="readout">
    <span id="coord">—</span>
    <span class="readout-rule"></span>
    <span id="depth">Surface</span>
    <span class="readout-rule"></span>
    <span id="zoom-label">—</span>
  </div>

  <div class="tooltip" id="tooltip" aria-hidden="true"></div>

  <script src="app.js"></script>
</body>
</html>
